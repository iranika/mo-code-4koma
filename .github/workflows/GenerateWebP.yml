name: Generate WebP Debug

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: image-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: FedericoCarboni/setup-ffmpeg@v3
    - name: initialize git setting.
      run: |
        git config --global user.name "iranika"
        git config --global user.email "7370486+iranika@users.noreply.github.com"
    - name: Setup PowerShell module cache
      id: cacher
      uses: actions/cache@v4
      with:
        path: "~/.local/share/powershell/Modules"
        key: ${{ runner.os }}-AngleParse
    - name: install module
      if: steps.cacher.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        Set-PSRepository PSGallery -InstallationPolicy Trusted
        Install-Module AngleParse
    - name: generate-webp
      run: |
        pwsh ./mops/generate-4komaDataJs.ps1 -Debug
        pwsh ./mops/download-img.ps1 -OnlyRecently -Debug
        pwsh ./mops/generate-webp.ps1 -OnlyRecently -Debug
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: requirements-simple.txt
    - name: Generate simple episode images and JSON
      run: |
        python -m pip install -r requirements-simple.txt
        python generate-simple.py
    - name: commit webp
      run: |
        git add 4koma/ 4komaData.json 4komaData.js 4komaDataMin.js 4komaDataSimple.json
        if ! git diff --cached --quiet; then
          git commit -m "debug: find update webp"
          git push
        fi
