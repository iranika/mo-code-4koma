name: Generate simple episodes

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'generate-simple.py'
      - 'test_generate_simple.py'
      - 'requirements-*.txt'
      - '4komaData*.json'
      - '4koma/ja/**'
      - '.github/workflows/GenerateSimple.yml'
      - '.github/workflows/NewUpdate.yml'
      - '.github/workflows/SkipFeed.yml'
      - '.github/workflows/GenerateWebP.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'requirements-*.txt'
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check generate-simple.py test_generate_simple.py
      - run: ruff format --check generate-simple.py test_generate_simple.py
      - run: mypy generate-simple.py --check-untyped-defs
      - run: python -m unittest -v
      - name: Check generated assets are up to date
        if: github.event_name == 'pull_request'
        run: |
          python generate-simple.py
          git diff --exit-code -- 4koma/ja/simple/ 4komaDataSimple.json

  generate:
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: image-update
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-simple.txt
      - run: python -m pip install -r requirements-simple.txt
      - run: python generate-simple.py
      - name: Commit generated images and JSON
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 4koma/ja/simple/ 4komaDataSimple.json
          if ! git diff --cached --quiet; then
            git commit -m 'Generate simple episode images and JSON'
            git push
          fi
